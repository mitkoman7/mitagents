<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DXC Databricks Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-avatar">&#129302;</div>
            <div class="header-info">
                <div class="header-title">DXC Databricks Assistant</div>
                <div class="header-subtitle">
                    <span class="header-status-dot"></span>Always online
                </div>
            </div>
            <div class="header-actions">
                <img
                    src="{{ url_for('static', filename='img/dxc-logo.png') }}"
                    alt="DXC Logo"
                    class="header-logo"
                />
                <button class="header-btn" id="clearBtn" title="Clear chat">&#128465;</button>
            </div>
        </div>

        <!-- Status bar -->
        <div id="statusBar" class="status-bar">Checking connection...</div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <!-- Typing indicator (hidden by default) -->
        </div>

        <!-- Typing indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="message-avatar" style="background:linear-gradient(135deg,var(--dxc-gradient-blue),var(--dxc-gradient-orange));">&#129302;</div>
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Input -->
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input
                    type="text"
                    id="chatInput"
                    class="chat-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                />
                <button class="send-btn" id="sendBtn" title="Send">
                    &#9654;
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
